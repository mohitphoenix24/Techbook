<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TypeLab — TypeScript for AI engineers</title>
  <meta name="description" content="Learn TypeScript from zero to advanced types, then build AI apps with it — the Claude SDK, streaming, tools, structured output, RAG, agents and MCP — with live editors that type-check and run your code.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233178c6'/%3E%3Ctext x='17' y='25' font-family='Arial' font-weight='700' font-size='15' fill='white' text-anchor='middle'%3ETS%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/vendor/cm/codemirror.min.css">
  <link rel="stylesheet" href="../shared/css/style.css">
  <style>
    :root { --accent: #2f6fd0; --accent-2: #7c3aed; --accent-3: #0891b2; }
    :root[data-theme="dark"] { --accent: #60a5fa; --accent-2: #a78bfa; --accent-3: #22d3ee; }
    .brand-logo { font-family: "Space Grotesk", sans-serif; letter-spacing: -0.5px; }

    /* type errors in the editor */
    .cm-ts-error { text-decoration: underline wavy #ef4444; text-decoration-skip-ink: none; text-underline-offset: 3px; }
    .ts-query { font: 12px/1.5 "JetBrains Mono", ui-monospace, monospace; color: var(--accent); white-space: pre-wrap; padding: 1px 0 3px; }
    .ts-query::before { content: "↳ "; opacity: .6; }
    .ts-diags { border-top: 1px solid color-mix(in srgb, #ef4444 35%, var(--border)); background: color-mix(in srgb, #ef4444 7%, transparent); padding: 8px 14px 10px; }
    .ts-diags-head { font-weight: 600; color: #ef4444; font-size: 13.5px; margin-bottom: 4px; }
    .ts-diags-head span { font-weight: 400; color: var(--muted); }
    .ts-diag { display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; width: 100%; text-align: left; background: none; border: 0; color: var(--text); padding: 4px 0; font: 13px/1.5 Inter, sans-serif; cursor: pointer; border-radius: 6px; }
    .ts-diag:hover { background: color-mix(in srgb, #ef4444 8%, transparent); }
    .ts-diag b { color: #ef4444; font-weight: 600; white-space: nowrap; }
    .ts-diag span { white-space: pre-wrap; }
    .ts-diag code { font-size: 11.5px; color: var(--muted); }
    .out-status.warn { color: #f59e0b; }
    .code-out .out-body span.warn { color: #f59e0b; }
    .code-out .out-body span.muted { color: var(--muted); font-style: italic; }
  </style>
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem("techcontent:theme"); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation" data-icon="menu"></button>
    <a class="brand" href="#/"><span class="brand-logo">TS</span><span class="brand-text">TypeLab<small>TypeScript for AI engineers</small></span></a>
    <button class="search-trigger" id="search-btn" aria-label="Search lessons" data-icon="search"><span>Search lessons, types, terms…</span><kbd>Ctrl K</kbd></button>
    <nav class="topnav">
      <a href="#/" data-nav="home" data-icon="home"><span>Home</span></a>
      <a href="#/m/foundations" data-nav="learn" data-icon="cap"><span>Learn</span></a>
      <a href="#/projects" data-nav="projects" data-icon="flask"><span>Projects</span></a>
      <a href="#/glossary" data-nav="glossary" data-icon="book"><span>Glossary</span></a>
    </nav>
    <span class="runtime-pill" id="runtime-pill" data-state="idle" title="Your code is type-checked by the real TypeScript compiler and run in a sandbox, all inside your browser"><span class="dot"></span><span class="rt-label">TypeScript: idle</span></span>
    <button class="icon-btn" id="theme-btn" aria-label="Toggle theme"></button>
  </header>

  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar" aria-label="Course navigation"></aside>
    <div class="scrim" id="scrim"></div>
    <main class="main" id="main"></main>
  </div>

  <div class="palette-backdrop" id="palette" role="dialog" aria-modal="true" aria-label="Search">
    <div class="palette">
      <div class="palette-input"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="palette-q" placeholder="Search lessons, projects and definitions…" autocomplete="off" spellcheck="false"><kbd>Esc</kbd></div>
      <div class="palette-results" id="palette-results"></div>
      <div class="palette-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> to move</span><span><kbd>Enter</kbd> to open</span><span><kbd>/</kbd> or <kbd>Ctrl K</kbd> anywhere</span></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="../shared/vendor/marked.min.js"></script>
  <script src="../shared/vendor/cm/codemirror.min.js"></script>
  <script src="../shared/vendor/cm/mode/javascript.min.js"></script>
  <script src="../shared/vendor/cm/mode/shell.min.js"></script>
  <script src="../shared/vendor/cm/mode/python.min.js"></script>
  <script src="../shared/vendor/cm/mode/xml.min.js"></script>
  <script src="../shared/vendor/cm/mode/css.min.js"></script>

  <script src="../shared/vendor/cm/addon/matchbrackets.min.js"></script>
  <script src="../shared/vendor/cm/addon/closebrackets.min.js"></script>
  <script src="../shared/vendor/cm/addon/comment.min.js"></script>
  <script>
    window.SITE = {
      name: "TypeLab",
      storageKey: "tsgenai",
      glossaryHint: "Filter terms… (e.g. generic, union, schema)",
      tagline: "TypeScript for AI engineers",
      badge: "TypeScript 7",
      eyebrow: "Types → Generics → Advanced types → Runtime safety → AI apps",
      heroTitle: 'Learn <span class="grad">TypeScript</span> the way AI apps use it.',
      heroSub: "From your first type to generics, mapped types and schema validation — then build with the Claude SDK: streaming, tools, structured output, RAG, agents and MCP. Every example is type-checked by the real compiler and runs right here.",
      heroNote: "No install needed — the TypeScript compiler runs inside this page.",
      pathGoal: "type-safe AI apps",
      runTitle: "Try it yourself",
      localHint: "Needs Node.js on your computer (npm packages, files, or an API key)",
      tocTip: "Errors are underlined as you type, and // ^? shows the type of whatever the caret points at. Press ▶ Run to execute.",
      footer: "Built for learning. Your code is type-checked and run inside your browser — nothing you type is sent anywhere.",
      features: [
        { icon: "smile", title: "Plain English first", text: "Every idea starts with what it's for and a simple example, before any jargon." },
        { icon: "book", title: "Definitions & syntax", text: "Clear definition cards and syntax boxes — all collected in the glossary." },
        { icon: "shield", title: "Real type checking", text: "Errors are underlined as you type, and // ^? shows exactly what type TypeScript sees." },
        { icon: "sparkles", title: "Built for AI apps", text: "The Claude SDK, streaming, tools with Zod, structured output, RAG, agents and MCP — all typed." },
      ],
      hero: {
        file: "agent.ts",
        lang: "ts",
        code: `import { z } from "zod";

const SearchArgs = z.object({
  query: z.string().min(2),
  topK: z.number().int().max(20).default(5),
});
type SearchArgs = z.infer<typeof SearchArgs>;
//   ^? { query: string; topK: number }

function search({ query, topK }: SearchArgs) {
  return docs.filter((d) => d.text.includes(query)).slice(0, topK);
}

// the model sends JSON — validate it before you trust it
const args = SearchArgs.parse(JSON.parse(modelToolCall.input));
console.log(search(args));`,
        output: `[
  { id: 'doc-7', text: 'Refunds are available within 30 days…' },
  { id: 'doc-2', text: 'To request a refund, open Billing…' }
]`,
      },
    };
  </script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/runner-ts.js"></script>
  <script src="../courses.js"></script>

</body>
</html>

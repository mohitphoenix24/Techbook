        file: "app/routes/chat.py",
        lang: "python",
        code: `# The heart of every project: stream the model's words.
@router.post("/chat")
async def chat(body: ChatRequest, llm: LLMClient = Depends(get_llm)):
    async def events():
        async for piece in llm.stream(system=SYSTEM, messages=history):
            yield sse("delta", {"text": piece.text})
        yield sse("done", {})
    return StreamingResponse(events(), media_type="text/event-stream")`,
        output: `event: delta
data: {"text": "Hello! "}

event: delta
data: {"text": "I am Pocket Chat."}

event: done
data: {}`,

        code: `import { Canvas, useFrame } from "@react-three/fiber";
import { OrbitControls, Environment } from "@react-three/drei";
import { useRef } from "react";

function Spinner() {
  const ref = useRef();
  useFrame((_, dt) => (ref.current.rotation.y += dt));
  return (
    <mesh ref={ref}>
      <torusKnotGeometry args={[1, 0.3, 200, 32]} />
      <meshStandardMaterial color="#34d399" metalness={0.6} roughness={0.2} />
    </mesh>
  );
}

export default function App() {
  return (
    <Canvas camera={{ position: [0, 0, 5] }}>
      <Spinner />
      <Environment preset="city" />
      <OrbitControls />
    </Canvas>
  );
}`,

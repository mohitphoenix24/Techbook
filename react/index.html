        code: `import { useState, useOptimistic } from "react";

export default function Chat() {
  const [messages, setMessages] = useState([]);
  const [optimistic, addOptimistic] = useOptimistic(messages,
    (list, text) => [...list, { text, sending: true }]);

  async function send(formData) {
    const text = formData.get("q");
    addOptimistic(text);               // show it instantly
    const reply = await askModel(text);
    setMessages((m) => [...m, { text }, { text: reply }]);
  }

  return (
    <form action={send}>
      {optimistic.map((m, i) => <p key={i}>{m.text}</p>)}
      <input name="q" /> <button>Send</button>
    </form>
  );
}`,

› Actions, useOptimistic, use(), and more ✨`,

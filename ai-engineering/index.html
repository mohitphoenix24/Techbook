# A language model only ever answers one question:
# "given the text so far, how likely is each possible next token?"
vocab  = ["cat", "dog", "pizza", "the", "sat"]
logits = np.array([2.0, 1.5, -1.0, 0.2, 1.0])

def softmax(z, temperature=1.0):
    z = z / temperature
    e = np.exp(z - z.max())
    return e / e.sum()

for t in (0.5, 1.0, 2.0):
    p = softmax(logits, t)
    print(f"T={t}:", {w: round(float(x), 2) for w, x in zip(vocab, p)})`,
